<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- GRYND Favicon Implementation -->
    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
    
    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    
    <!-- Other sizes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Browser theme colors -->
    <meta name="theme-color" content="#8b5cf6">
    <meta name="msapplication-TileColor" content="#1e1f29">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GRYND - Build Relentless Consistency. The discipline-focused productivity platform for serious students." />
    <title>GRYND - HyperProductivity App</title>
    <style>
      /* Prevent flash of unstyled content */
      body {
        background-color: #111827;
        color: white;
      }
      
      /* Loading fallback */
      #root:empty::before {
        content: "SETTING UP GRYND...";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 1.2rem;
        color: #2F0087;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
